<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleEat — El chef argentino de tu heladera</title>
  <meta name="description" content="SimpleEat te dice qué cocinar con lo que tenés, con técnica de Master Chef y nomenclatura oficial argentina (IPCVA · INTA · GAPA)." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="halo halo--uno" aria-hidden="true"></div>
  <div class="halo halo--dos" aria-hidden="true"></div>

  <header class="cabecera">
    <div class="marca">
      <span class="marca__simple">Simple</span><span class="marca__eat">Eat</span>
      <span class="marca__nodo">Nodo Paraná</span>
    </div>
    <p class="cabecera__lema">El chef argentino que cocina con lo que tenés.</p>
  </header>

  <main class="principal">
    <!-- Omnibar: el corazón de la "tecnología invisible" -->
    <section class="omnibar" aria-label="Buscador de recetas">
      <div class="omnibar__caja">
        <span class="omnibar__icono" aria-hidden="true">🥘</span>
        <input
          id="omnibar"
          class="omnibar__input"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="¿Qué tenés? Ej: 2 alitas, 1 cebolla morada"
          aria-label="Ingredientes que tenés"
        />
        <button id="foto" class="omnibar__foto" type="button" aria-label="Sacar foto de la heladera" title="Sacar foto">📷</button>
        <button id="cocinar" class="omnibar__boton" type="button">Cocinar</button>
      </div>
      <input id="captura" type="file" accept="image/*" capture="environment" hidden />
      <div class="sugerencias" id="sugerencias" aria-label="Ejemplos rápidos"></div>
    </section>

    <!-- Resultado de la receta -->
    <section id="resultado" class="resultado" hidden aria-live="polite"></section>

    <!-- Estado vacío inicial -->
    <section id="vacio" class="vacio">
      <p class="vacio__frase">Escribí lo que tenés y te digo <strong>qué</strong> cocinar y <strong>cómo</strong>, con la técnica de un chef.</p>
      <p class="vacio__detalle">Nomenclatura oficial IPCVA · INTA · GAPA — y el toque de Entre Ríos.</p>
    </section>
  </main>

  <footer class="pie">
    <span>Simple<span class="marca__eat">Eat</span></span>
    <span class="pie__nota">Gastronomía argentina · Nodo Paraná</span>
  </footer>

  <script src="js/data/ingredientes.js"></script>
  <script src="js/core/parser.js"></script>
  <script src="js/core/cocina.js"></script>
  <script src="js/core/coping.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
